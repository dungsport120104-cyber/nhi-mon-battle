<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#172b54"><title>Nhi & Mon Battle</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15264c;font-family:system-ui,-apple-system,sans-serif;touch-action:none;color:white}#app{position:fixed;inset:0;display:flex;flex-direction:column}header{height:55px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:5px 12px;background:#142a50}header strong{font-size:clamp(13px,2.7vw,21px)}.pill{background:#263f72;border:1px solid #8faee2;border-radius:22px;padding:7px 10px;font-weight:800;font-size:13px}#field{flex:1;position:relative;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}#hud{position:absolute;top:9px;left:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none;font-size:clamp(12px,2vw,18px);font-weight:900;text-shadow:0 2px 3px #243b6c}.hudbox{background:#19365ab8;border-radius:18px;padding:6px 10px}#panel{background:#172d55;padding:7px 10px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.15fr;gap:8px;align-items:center}button{border:2px solid #e7f5ff;border-radius:14px;background:#347bd4;color:white;font-weight:900;font-size:clamp(13px,2.7vw,19px);min-height:45px;touch-action:none;cursor:pointer}button:active{filter:brightness(1.3)}.action{background:#ffbd36;color:#4b2d05}.group{display:flex;gap:5px;align-items:center}.group button{flex:1}.meter{font-size:12px;text-align:center}.meter input{width:100%;accent-color:#ffc62f;touch-action:pan-x}#overlay{position:absolute;inset:0;background:#11234edb;display:flex;align-items:center;justify-content:center;padding:12px;z-index:4}#overlay.hidden{display:none}.modal{background:#fff9e9;color:#23385b;border:5px solid #f6c45a;border-radius:23px;max-width:520px;width:100%;padding:20px;text-align:center;box-shadow:0 12px 40px #0008;max-height:95%;overflow:auto}.modal h1{font-size:clamp(22px,4vw,34px);margin:0 0 10px}.modal p{font-size:15px}.modal button{margin:5px;padding:10px 15px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:6px}.answers button{background:#4386d4}.note{font-size:12px;color:#54637a}#message{position:absolute;top:24%;left:50%;transform:translateX(-50%);font-size:clamp(17px,3.5vw,30px);font-weight:1000;text-shadow:2px 3px #172a4b;pointer-events:none;text-align:center;white-space:nowrap} @media (orientation:portrait){header{height:46px}#panel{grid-template-columns:1fr 1fr;gap:5px}#panel .meter{grid-column:1 / 3;grid-row:1}#panel button{min-height:42px}}
</style></head><body><div id="app"><header><strong>🚀 Nhi & Mon Battle</strong><span class="pill" id="round">Lượt 1</span><button id="sound" style="min-height:35px">🔊</button></header><div id="field"><canvas id="game"></canvas><div id="hud"><div class="hudbox" id="leftHp">🌸 Nhi 100 HP</div><div class="hudbox" id="wind">🌬️ Gió 0</div><div class="hudbox" id="rightHp">🤖 Máy 100 HP</div></div><div id="message"></div><div id="overlay"><div class="modal" id="modal"></div></div></div><div id="panel"><div class="group"><button id="minus">◀ Góc</button><button id="plus">Góc ▶</button></div><div class="meter"><b id="angleText">Góc 45° · Lực 65%</b><input id="power" type="range" min="20" max="100" value="65"></div><button class="action" id="fire">🔥 BẮN!</button></div></div><script>
(()=>{'use strict';const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),overlay=document.getElementById('overlay'),modal=document.getElementById('modal'),msg=document.getElementById('message'),power=document.getElementById('power');let W=900,H=430,dpr=1,terrain=[],particles=[],projectile=null,turn=0,angle=45,wind=0,level=1,coins=0,sound=true,active=true,anim=0,aiTimer=0;const tanks=[{x:120,hp:100,color:'#f45b9a',name:'Nhi',face:1},{x:780,hp:100,color:'#5e8bf5',name:'Máy',face:-1}];const words=[['Cat','🐱','Dog','🐶','Cat'],['Apple','🍎','Banana','🍌','Apple'],['Sun','☀️','Moon','🌙','Sun'],['Fish','🐟','Bird','🐦','Fish'],['Red','🔴','Blue','🔵','Red'],['Tree','🌳','Flower','🌷','Tree'],['Car','🚗','Bus','🚌','Car'],['Star','⭐','Heart','❤️','Star']];let questionIndex=0;function store(){try{localStorage.setItem('nmb_v1',JSON.stringify({level,coins}))}catch(e){}}try{const s=JSON.parse(localStorage.getItem('nmb_v1')||'{}');level=Math.max(1,Math.min(20,s.level||1));coins=s.coins||0}catch(e){}
function resize(){const r=canvas.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.max(1,Math.floor(r.width*dpr));canvas.height=Math.max(1,Math.floor(r.height*dpr));W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);tanks[0].x=W*.14;tanks[1].x=W*.86;makeTerrain()}function makeTerrain(){terrain=[];for(let x=0;x<=W+5;x+=5){const h=H*(.77+ .045*Math.sin(x/W*Math.PI*3)+.025*Math.sin(x/W*Math.PI*7));terrain.push(h)}}function ground(x){return terrain[Math.max(0,Math.min(terrain.length-1,Math.round(x/5)))]||H*.8}function rounded(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function tankDraw(t){let x=t.x,y=ground(x)-15;ctx.save();ctx.translate(x,y);ctx.scale(t.face,1);ctx.fillStyle='#223f70';ctx.beginPath();ctx.ellipse(0,7,24,10,0,0,Math.PI*2);ctx.fill();for(let i=-1;i<=1;i++){ctx.fillStyle='#dce6f4';ctx.beginPath();ctx.arc(i*12,8,5,0,7);ctx.fill()}rounded(-22,-11,44,18,8,t.color);ctx.save();ctx.translate(2,-10);ctx.rotate(-((t===tanks[0]?angle:45)*Math.PI/180));rounded(0,-5,35,10,4,'#34486b');ctx.restore();ctx.fillStyle='#ffe2bf';ctx.beginPath();ctx.arc(0,-25,13,0,7);ctx.fill();ctx.fillStyle=t===tanks[0]?'#6a3856':'#344d88';ctx.beginPath();ctx.arc(0,-31,13,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#223657';ctx.beginPath();ctx.arc(-4,-25,1.8,0,7);ctx.arc(5,-25,1.8,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.fillText(t===tanks[0]?'NHI':'BOT',0,-45);ctx.restore()}
function draw(){ctx.clearRect(0,0,W,H);const sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#74c5fc');sky.addColorStop(1,'#e0f6ff');ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe66b';ctx.beginPath();ctx.arc(W*.78,H*.18,Math.max(18,W*.025),0,7);ctx.fill();for(let i=0;i<5;i++){let x=(i*W/4+Math.sin(anim*.00025+i)*15)%W,y=H*(.16+.07*(i%3));ctx.fillStyle='#ffffffbd';for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(x+j*17,y+(j%2)*-6,20,12,0,0,7);ctx.fill()}}ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,ground(0));for(let x=5;x<=W;x+=5)ctx.lineTo(x,ground(x));ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#996238';ctx.fill();ctx.strokeStyle='#5cb64b';ctx.lineWidth=9;ctx.beginPath();for(let x=0;x<=W;x+=5){if(x===0)ctx.moveTo(x,ground(x));else ctx.lineTo(x,ground(x))}ctx.stroke();for(let i=0;i<8;i++){let x=(i+.4)*W/8,y=ground(x)-9;ctx.fillStyle='#ffed85';ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}tanks.forEach(tankDraw);if(projectile){ctx.fillStyle='#ffe63e';ctx.shadowColor='#ff9120';ctx.shadowBlur=15;ctx.beginPath();ctx.arc(projectile.x,projectile.y,7,0,7);ctx.fill();ctx.shadowBlur=0}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}ctx.globalAlpha=1;anim+=16}
function hud(){document.getElementById('leftHp').textContent='🌸 Nhi '+Math.max(0,tanks[0].hp)+' HP';document.getElementById('rightHp').textContent='🤖 Máy '+Math.max(0,tanks[1].hp)+' HP';document.getElementById('wind').textContent='🌬️ '+(wind>0?'→ ':wind<0?'← ':'')+Math.abs(wind);document.getElementById('round').textContent='Màn '+level+' · 🪙 '+coins;document.getElementById('angleText').textContent='Góc '+angle+'° · Lực '+power.value+'%'}function beep(f=500,d=.1){if(!sound)return;try{const ac=window._audio||(window._audio=new (window.AudioContext||window.webkitAudioContext)());if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;g.gain.value=.045;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}function show(text,time=1100){msg.textContent=text;setTimeout(()=>{if(msg.textContent===text)msg.textContent=''},time)}function open(html){active=false;modal.innerHTML=html;overlay.classList.remove('hidden')}function close(){overlay.classList.add('hidden');active=true}function newRound(){tanks[0].hp=100;tanks[1].hp=100;turn=0;projectile=null;particles=[];angle=45;power.value=65;wind=Math.floor(Math.random()*13)-6;makeTerrain();hud();show('🎯 Bắn trúng đối thủ!')}
function ask(){let q=words[questionIndex++%words.length];open('<h1>📚 Câu hỏi tiếng Anh</h1><p>Chọn hình đúng với từ: <b style="font-size:25px">'+q[0]+'</b></p><button id="speak">🔊 Nghe phát âm</button><div class="answers"><button data-a="'+q[0]+'">'+q[1]+'</button><button data-a="'+q[2]+'">'+q[3]+'</button></div><p class="note">Đúng được +10 xu và hồi 10 HP!</p>');modal.querySelector('#speak').onclick=()=>{try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(q[0]);u.lang='en-US';u.rate=.8;speechSynthesis.speak(u)}catch(e){}};modal.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(b.dataset.a===q[4]){coins+=10;tanks[0].hp=Math.min(100,tanks[0].hp+10);beep(800,.2);show('⭐ Chính xác! +10 xu')}else{beep(180,.2);show('💪 Thử lại ở câu sau!')}store();hud();close();nextTurn()})}
function nextTurn(){if(tanks[0].hp<=0||tanks[1].hp<=0){let win=tanks[1].hp<=0;if(win){coins+=30;level++;store()}open('<h1>'+(win?'🏆 Chiến thắng!':'💛 Thử lại nhé!')+'</h1><p>'+(win?'Nhận 30 xu và mở màn '+level+'!':'Bé có thể chơi lại để luyện ngắm bắn.')+'</p><button id="again">'+(win?'▶ Màn tiếp theo':'↻ Chơi lại')+'</button>');document.getElementById('again').onclick=()=>{newRound();close()};return}turn=1-turn;wind=Math.floor(Math.random()*13)-6;hud();if(turn===1){show('🤖 Đến lượt máy');aiTimer=setTimeout(()=>{if(turn===1&&!projectile&&active)shoot(1,36+Math.random()*32,48+Math.random()*40)},900)}else{show('🌸 Đến lượt Nhi');ask()}}
function shoot(who,a,p){if(projectile||!active)return;let t=tanks[who],rad=a*Math.PI/180,speed=(p/100)*(W*.75)+W*.13;projectile={x:t.x+t.face*26,y:ground(t.x)-27,vx:t.face*Math.cos(rad)*speed,vy:-Math.sin(rad)*speed,who};beep(390,.13);hud()}
function physics(dt){if(projectile){let p=projectile;p.x+=(p.vx+wind*W*.004)*dt;p.y+=p.vy*dt;p.vy+=H*1.7*dt;let hit=tanks[1-p.who];if(Math.hypot(p.x-hit.x,p.y-(ground(hit.x)-18))<23){explode(p.x,p.y,hit);return}if(p.y>=ground(p.x)||p.x<0||p.x>W||p.y>H){explode(Math.max(0,Math.min(W,p.x)),Math.min(H,p.y),null)}}for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=H*.5*dt;p.life-=dt*50;if(p.life<=0)particles.splice(i,1)}}function explode(x,y,hit){let p=projectile;projectile=null;beep(130,.28);for(let i=0;i<25;i++){let a=Math.random()*7,s=30+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*5,life:40,color:i%2?'#ffd84d':'#ff6a3c'})}if(hit){hit.hp=Math.max(0,hit.hp-(18+Math.floor(Math.random()*14)));show('💥 Trúng đích!')}else{show('💨 Trượt rồi!');for(let i=0;i<terrain.length;i++){let xx=i*5,dist=Math.abs(xx-x);if(dist<26)terrain[i]+=Math.sqrt(1-(dist/26)**2)*13}}hud();setTimeout(()=>{if(!projectile&&overlay.classList.contains('hidden'))nextTurn()},650)}let last=0;function loop(ts){let dt=Math.min(.035,(ts-last)/1000||.016);last=ts;if(active)physics(dt);draw();requestAnimationFrame(loop)}
function hold(id,delta){let b=document.getElementById(id),timer=null;const step=()=>{angle=Math.max(10,Math.min(85,angle+delta));hud()};b.addEventListener('pointerdown',e=>{e.preventDefault();step();timer=setInterval(step,90);try{b.setPointerCapture(e.pointerId)}catch(_){}});function stop(){clearInterval(timer);timer=null}['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stop))}hold('minus',-1);hold('plus',1);document.getElementById('fire').addEventListener('pointerdown',e=>{e.preventDefault();if(turn===0)shoot(0,angle,+power.value)});power.oninput=hud;document.getElementById('sound').onclick=()=>{sound=!sound;document.getElementById('sound').textContent=sound?'🔊':'🔇';if(sound)beep()};document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(aiTimer)});window.addEventListener('resize',resize);resize();newRound();open('<h1>🚀 Nhi & Mon Battle</h1><p>Game bắn tọa độ học tiếng Anh, lấy cảm hứng từ Gunbound!</p><p>🎯 Chỉnh góc, chọn lực, quan sát hướng gió rồi bắn. Trúng máy sẽ giảm HP. Sau mỗi lượt bé trả lời từ vựng để nhận xu.</p><p class="note">Chơi ngang màn hình trên Safari. Không cần đăng nhập, tự lưu xu và màn.</p><button id="start">🎮 BẮT ĐẦU CHƠI</button>');document.getElementById('start').onclick=()=>{close();beep(660,.12)};requestAnimationFrame(loop);
})();</script></body></html>
