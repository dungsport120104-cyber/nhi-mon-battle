<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#172c55"><title>Nhi & Mon Battle</title><style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}html,body{margin:0;height:100%;overflow:hidden;background:#13264a;font-family:system-ui,-apple-system,sans-serif;color:#fff;touch-action:none}button,input{touch-action:manipulation}button{border:2px solid #fff;border-radius:14px;background:#367dd1;color:#fff;font-size:clamp(13px,2.4vh,19px);font-weight:800;padding:9px;min-height:43px}button:disabled{opacity:.35}button:active{filter:brightness(1.22)}#app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 7px env(safe-area-inset-bottom);gap:4px}header{display:flex;align-items:center;justify-content:space-between;gap:4px;min-height:37px;font-size:clamp(12px,2.1vh,17px);font-weight:800}#difficulty{max-width:116px;min-width:77px;background:#284b7d;color:white;border:1px solid #9bb7db;border-radius:10px;font-size:12px;font-weight:800;padding:6px 2px}#status{border-radius:16px;background:#284b7d;padding:7px 10px;text-align:center;color:#fff5aa;flex:1}#hud{display:flex;justify-content:space-between;gap:4px;font-size:clamp(11px,2vh,16px);font-weight:750}#hud span{background:#274976;border-radius:15px;padding:5px 9px}#scene{flex:1;min-height:100px;position:relative;border-radius:12px;overflow:hidden;background:#9ddfff}canvas{width:100%;height:100%;display:block;touch-action:none}#controls{background:#1a345f;border-radius:12px;padding:7px;display:grid;gap:6px}#readout{text-align:center;font-size:14px;font-weight:800}#power{width:100%;accent-color:#ffcb43;height:21px}#buttons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)) 1.35fr;gap:5px}#buttons button{min-width:0;padding:8px 2px}#fire{background:#ffbd42;color:#4a2700}#move{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px}#move button{background:#326aab}#moveNote{text-align:center;color:#c9e4ff;font-size:11px}#modal{position:fixed;inset:0;background:#06132fcf;display:none;align-items:center;justify-content:center;z-index:9;padding:15px}#modal.show{display:flex}#panel{width:min(94vw,480px);background:#fff;color:#1d3561;border-radius:24px;padding:20px;text-align:center;box-shadow:0 12px 40px #0008}#panel h2{margin:5px 0}#panel p{line-height:1.5}#answers{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}#answers button{background:#4d8bd4}#closeModal{width:100%;background:#20a774}#toast{position:absolute;top:12%;left:50%;transform:translateX(-50%);background:#12274edc;padding:9px 14px;border-radius:14px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}#toast.show{opacity:1}@media(orientation:landscape) and (max-height:550px){#app{gap:2px}header{min-height:27px}#controls{padding:4px;gap:2px}button{min-height:32px;padding:4px}#moveNote{display:none}#hud span{padding:3px 7px}#power{height:14px}}
</style></head><body><div id="app"><header><span>🚀 Nhi & Mon Battle</span><span id="status">LƯỢT CỦA BẠN</span><select id="difficulty" aria-label="Độ khó của máy"><option value="easy">🟢 Dễ</option><option value="normal">🟡 Vừa</option><option value="hard">🔴 Khó</option></select><button id="sound" aria-label="Âm thanh">🔊</button></header><div id="hud"><span id="hp1">🌸 Nhi 100 HP</span><span id="wind">🌬️ Gió 0</span><span id="hp2">🤖 Máy 100 HP</span></div><div id="scene"><canvas id="game"></canvas><div id="toast"></div></div><div id="controls"><div id="readout">Góc 45° • Lực 65%</div><input id="power" aria-label="Lực bắn" type="range" min="15" max="100" value="65"><div id="buttons"><button id="angleDown">◀ Góc −</button><button id="angleUp">Góc + ▶</button><button id="fire">🔥 BẮN!</button></div><div id="move"><button id="left">◀ Lùi xe</button><button id="reset">↻ Chơi lại</button><button id="right">Tiến xe ▶</button></div><div id="moveNote">Giữ Lùi/Tiến để di chuyển • Mỗi lượt chỉ bắn một lần</div></div></div><div id="modal"><div id="panel"><h2 id="modalTitle">🎉</h2><p id="modalText"></p><div id="answers"></div><button id="closeModal">Tiếp tục</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),scene=$('scene');let W=800,H=420,terrain=[],shots=[],particles=[],angle=45,power=65,wind=0,turn='player',phase='ready',projectile=null,aiTimer=null,last=0,moving=0,moveBudget=0,frame=0,muted=false,modalKind='',coins=0,level=1,questionIndex=0,difficulty='easy',questionOpen=false;try{const s=JSON.parse(localStorage.getItem('nmb-v2')||'{}');coins=s.coins||0;level=s.level||1;difficulty=s.difficulty||'easy'}catch(e){}const player={x:90,hp:100,dir:1,color:'#ff5ca9',name:'NHI'},enemy={x:700,hp:100,dir:-1,color:'#587cff',name:'MÁY'};const questions=[['Which one is an apple?',['Apple 🍎','Cat 🐱','Dog 🐶','Fish 🐟'],0],['What color is the sun?',['Blue','Yellow','Purple','Black'],1],['Which animal says meow?',['Dog','Bird','Cat','Cow'],2],['What is “quả chuối” in English?',['Orange','Banana','Apple','Pear'],1],['What is the opposite of BIG?',['Small','Tall','Fast','Long'],0]];let audio=null;function beep(freq=520,duration=.1){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.07,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
function save(){try{localStorage.setItem('nmb-v2',JSON.stringify({coins,level,difficulty}))}catch(e){}}function resize(){const r=scene.getBoundingClientRect();W=Math.max(280,r.width);H=Math.max(150,r.height);const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);makeTerrain()}function makeTerrain(){terrain=[];for(let i=0;i<=W;i+=2){const x=i/W;terrain.push({x:i,y:H*(.78-.13*Math.exp(-Math.pow((x-.5)/.16,2))+.022*Math.sin(x*16))})}if(terrain[terrain.length-1].x<W)terrain.push({x:W,y:H*.78})}function ground(x){const i=Math.max(0,Math.min(terrain.length-2,Math.floor(x/2)));const a=terrain[i],b=terrain[i+1];return a.y+(b.y-a.y)*Math.max(0,Math.min(1,(x-a.x)/(b.x-a.x)))}function makeCrater(x,r){for(const p of terrain){const dx=Math.abs(p.x-x);if(dx<r)p.y=Math.min(H-9,p.y+Math.sqrt(r*r-dx*dx)*.43)}}function tank(t){const y=ground(t.x),flip=t.dir;ctx.save();ctx.translate(t.x,y-6);ctx.fillStyle='#2d3d67';ctx.beginPath();ctx.ellipse(0,0,27,10,0,0,Math.PI*2);ctx.fill();for(let i=-17;i<=17;i+=17){ctx.fillStyle='#d6e6f8';ctx.beginPath();ctx.arc(i,1,5,0,7);ctx.fill()}ctx.fillStyle=t.color;round(-28,-19,56,20,10);ctx.fill();ctx.strokeStyle='#263b66';ctx.lineWidth=9;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(flip*6,-20);let a=t===player?angle:(t.aim||45);ctx.lineTo(flip*(7+Math.cos(a*Math.PI/180)*28),-20-Math.sin(a*Math.PI/180)*28);ctx.stroke();ctx.fillStyle='#ffdbac';ctx.beginPath();ctx.arc(0,-33,15,0,7);ctx.fill();ctx.fillStyle=t===player?'#753961':'#344779';ctx.fillRect(-15,-48,30,9);ctx.fillStyle='#1e3359';ctx.beginPath();ctx.arc(flip*6,-35,2,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(t.name,0,-55);ctx.restore()}function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}function sky(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#70c6ff');g.addColorStop(1,'#e1f8ff');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#ffe47d';ctx.beginPath();ctx.arc(W*.78,H*.15,Math.max(15,H*.06),0,7);ctx.fill();ctx.fillStyle='#ffffffbb';for(let i=0;i<5;i++){const x=(i*.23+.08)*W,y=(.12+(i%3)*.12)*H;ctx.beginPath();ctx.ellipse(x,y,30,12,0,0,7);ctx.ellipse(x+18,y-5,20,14,0,0,7);ctx.fill()}}function draw(){ctx.clearRect(0,0,W,H);sky();ctx.beginPath();ctx.moveTo(0,H);ctx.lineTo(0,ground(0));for(const p of terrain)ctx.lineTo(p.x,p.y);ctx.lineTo(W,H);ctx.closePath();ctx.fillStyle='#9c653e';ctx.fill();ctx.strokeStyle='#4dc54d';ctx.lineWidth=9;ctx.beginPath();for(let i=0;i<terrain.length;i++){const p=terrain[i];if(i===0)ctx.moveTo(p.x,p.y);else ctx.lineTo(p.x,p.y)}ctx.stroke();tank(player);tank(enemy);for(const p of shots){ctx.fillStyle='#ffdd6b';ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill()}if(projectile){ctx.fillStyle='#ff7b19';ctx.beginPath();ctx.arc(projectile.x,projectile.y,6,0,7);ctx.fill()}for(const p of particles){ctx.fillStyle=`rgba(255,${Math.floor(110+p.life*120)},30,${Math.max(0,p.life)})`;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fill()}}
function updateHud(){const st=phase==='flying'?'💥 ĐẠN ĐANG BAY':phase==='over'?'🏁 KẾT THÚC':turn==='player'?'🎯 LƯỢT CỦA BẠN':'🤖 LƯỢT CỦA MÁY';$('status').textContent=st;$('hp1').textContent=`🌸 Nhi ${Math.max(0,Math.ceil(player.hp))} HP`;$('hp2').textContent=`🤖 Máy ${Math.max(0,Math.ceil(enemy.hp))} HP`;$('wind').textContent=`🌬️ ${wind<0?'◀':'▶'} ${Math.abs(wind).toFixed(1)}`;$('readout').textContent=`Góc ${angle}° • Lực ${power}% • Di chuyển còn ${Math.round(moveBudget)} px`;$('power').value=power;const can=turn==='player'&&phase==='ready'&&!questionOpen;for(const id of ['fire','angleDown','angleUp','power','left','right'])$(id).disabled=!can}
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.remove('show'),1200)}function newTurn(side){turn=side;questionOpen=false;phase='ready';moving=0;moveBudget=side==='player'?Math.max(35,W*.12):0;wind=(Math.random()*2-1)*2.5;updateHud();if(side==='ai'){aiTimer=setTimeout(aiFire,900)}else toast('🎯 Đến lượt Nhi!')}
function fire(side,a,p){if(phase!=='ready'||turn!==side||questionOpen)return;moving=0;phase='flying';clearTimeout(aiTimer);const t=side==='player'?player:enemy,dir=t.dir,rad=a*Math.PI/180;const speed=(H*.9+W*.18)*(0.30+p/100*.95);projectile={x:t.x+dir*24,y:ground(t.x)-28,vx:dir*Math.cos(rad)*speed,vy:-Math.sin(rad)*speed,owner:side,age:0};shots=[];beep(320,.18);updateHud()}
function aiFire(){if(turn!=='ai'||phase!=='ready')return;const dx=enemy.x-player.x,dy=ground(enemy.x)-ground(player.x);let best={score:Infinity,a:45,p:65};for(let a=24;a<=78;a+=3)for(let p=35;p<=100;p+=3){let x=enemy.x-24,y=ground(enemy.x)-28,rad=a*Math.PI/180,speed=(H*.9+W*.18)*(.30+p/100*.95),vx=-Math.cos(rad)*speed,vy=-Math.sin(rad)*speed;for(let i=0;i<240;i++){const dt=.025;vx+=wind*12*dt;vy+=H*1.15*dt;x+=vx*dt;y+=vy*dt;if(y>=ground(x)||x<0)break}let score=Math.abs(x-player.x)+Math.random()*W*.025;if(score<best.score)best={score,a,p}}const spread=difficulty==='easy'?18:difficulty==='normal'?8:2;const aimAngle=Math.max(10,Math.min(85,Math.round(best.a+(Math.random()*2-1)*spread)));const aimPower=Math.max(15,Math.min(100,Math.round(best.p+(Math.random()*2-1)*spread*1.4)));enemy.aim=aimAngle;fire('ai',aimAngle,aimPower)}
function explosion(x,y){beep(145,.25);for(let i=0;i<24;i++){const a=Math.random()*7,s=35+Math.random()*130;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*5,life:1})}makeCrater(x,Math.min(36,W*.055));const target=projectile.owner==='player'?enemy:player;const dist=Math.hypot(x-target.x,y-(ground(target.x)-22));if(dist<Math.max(48,W*.065)){const dmg=Math.round(24+Math.max(0,1-dist/65)*18);target.hp=Math.max(0,target.hp-dmg);toast(`💥 Trúng ${dmg} HP!`)}projectile=null;updateHud();if(player.hp<=0||enemy.hp<=0){phase='over';if(enemy.hp<=0){coins+=30;level++;save();showModal('win','🏆 Nhi chiến thắng!',`Nhận 30 xu! Tổng: ${coins} xu.`,[])}else showModal('lose','🤖 Máy chiến thắng','Thử lại nhé! Chỉnh góc và tăng lực để bắn xa hơn.',[]);updateHud();return}if(turn==='player'){setTimeout(()=>newTurn('ai'),800)}else setTimeout(()=>{newTurn('player');showQuestion()},650)}
function tick(dt){frame++;if(phase==='ready'&&turn==='player'&&!questionOpen&&moving&&moveBudget>0){const delta=moving*Math.min(W*.35*dt,moveBudget);player.x=Math.max(34,Math.min(W-34,player.x+delta));moveBudget-=Math.abs(delta);if(moveBudget<=0)moving=0;updateHud()}if(projectile){const steps=4,step=dt/steps;for(let k=0;k<steps&&projectile;k++){const p=projectile;p.age+=step;p.vx+=wind*12*step;p.vy+=H*1.15*step;p.x+=p.vx*step;p.y+=p.vy*step;if(p.x<0||p.x>W||p.y>H+20){const owner=p.owner;projectile=null;if(owner==='player')setTimeout(()=>newTurn('ai'),700);else setTimeout(()=>{newTurn('player');showQuestion()},700);break}if(p.age>.08&&p.y>=ground(p.x)-3){explosion(p.x,ground(p.x));break}}}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=150*dt;p.life-=dt*1.6;if(p.life<=0)particles.splice(i,1)}}function loop(t){const dt=Math.min(.035,(t-last)/1000||.016);last=t;tick(dt);draw();requestAnimationFrame(loop)}
function showModal(kind,title,desc,answers){modalKind=kind;$('modalTitle').textContent=title;$('modalText').textContent=desc;$('answers').innerHTML='';for(let i=0;i<answers.length;i++){const b=document.createElement('button');b.textContent=answers[i];b.onclick=()=>answer(i);$('answers').appendChild(b)}$('closeModal').style.display=kind==='question'?'none':'block';$('closeModal').textContent=kind==='win'||kind==='lose'?'Chơi trận mới':'Tiếp tục';$('modal').classList.add('show')}
let correct=0;function showQuestion(){if(phase==='over')return;questionOpen=true;moving=0;updateHud();const q=questions[questionIndex++%questions.length];correct=q[2];showModal('question','📚 Câu hỏi tiếng Anh',q[0],q[1]);try{speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(q[0]);utter.lang='en-US';utter.rate=.8;speechSynthesis.speak(utter)}catch(e){}}function answer(i){if(i===correct){const healed=Math.min(20,100-player.hp);player.hp+=healed;coins+=5;save();beep(700,.13);toast('💚 Đúng rồi! +'+healed+' HP • +5 xu')}else toast('💛 Chưa đúng! Lần sau cố lên!');questionOpen=false;$('modal').classList.remove('show');updateHud()}function reset(){questionOpen=false;clearTimeout(aiTimer);projectile=null;particles=[];shots=[];player.hp=enemy.hp=100;player.x=W*.13;enemy.x=W*.87;makeTerrain();angle=45;power=65;newTurn('player');$('modal').classList.remove('show')}
$('closeModal').onclick=()=>{if(modalKind==='win'||modalKind==='lose')reset();else $('modal').classList.remove('show')};$('fire').onclick=()=>fire('player',angle,power);$('angleDown').onclick=()=>{angle=Math.max(10,angle-3);updateHud();beep(460,.04)};$('angleUp').onclick=()=>{angle=Math.min(85,angle+3);updateHud();beep(490,.04)};$('power').oninput=e=>{power=+e.target.value;updateHud()};$('reset').onclick=reset;$('difficulty').value=difficulty;$('difficulty').onchange=e=>{difficulty=e.target.value;save();toast('Độ khó: '+({easy:'Dễ',normal:'Trung bình',hard:'Khó'}[difficulty]))};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇':'🔊';if(!muted)beep()};
for(const [id,d] of [['left',-1],['right',1]]){const el=$(id);el.addEventListener('pointerdown',e=>{if(turn!=='player'||phase!=='ready'||questionOpen)return;e.preventDefault();el.setPointerCapture(e.pointerId);moving=d});const stop=e=>{if(moving===d)moving=0};el.addEventListener('pointerup',stop);el.addEventListener('pointercancel',stop);el.addEventListener('lostpointercapture',stop)}window.addEventListener('blur',()=>moving=0);document.addEventListener('visibilitychange',()=>{if(document.hidden)moving=0});document.addEventListener('contextmenu',e=>e.preventDefault());window.addEventListener('resize',()=>{const oldP=player.x/W,oldE=enemy.x/W;resize();player.x=oldP*W;enemy.x=oldE*W});resize();reset();requestAnimationFrame(loop);
})();</script></body></html>
